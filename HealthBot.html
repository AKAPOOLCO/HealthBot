/* =============================================================================
   Self-test harness (Checkpoint 7 of §10 / §8). No build step ⇒ no test
   runner, so the checks live in-page at #/selftest. All checks run against
   synthetic state/data built here — nothing touches STATE or localStorage.
   ========================================================================== */

/**
 * §3/§8 reference table — total prescribed sets (sets+kb checkbox glyphs,
 * NOT tasks or tests) per week, counted by hand from
 * 24_Week_Printable_Log_v7_7_Shaolin.pdf. Since every week maps to one of
 * eight (phase,variant) templates (§4.1), weeks sharing a template share a
 * count; listed per week (1–24) for a direct, unambiguous diff against
 * weekSetCount(PROGRAM.weeks[i]).
 */
const EXPECTED_WEEK_SET_COUNTS = [
  47, 47, 47, 29, 47, 47, 47, 29,           // weeks  1– 8  (Phase 1)
  47, 49, 47, 28, 49, 47, 49, 28,           // weeks  9–16  (Phase 2)
  37, 38, 37, 19, 37, 38, 37, 19            // weeks 17–24  (Phase 3)
];

/** §3 — phase/variant label expected per week, straight from WEEK_MAP. */
const EXPECTED_WEEK_LABELS = WEEK_MAP.map((e) => ({
  phase: e.phase,
  variantLabel: VARIANT_LABEL[e.variant]
}));

/** Minimal deterministic deep-equal (key order independent) for test assertions. */
function deepEqual(a, b) {
  if (a === b) return true;
  if (typeof a !== typeof b) return false;
  if (a === null || b === null) return a === b;
  if (typeof a !== 'object') return a === b;
  if (Array.isArray(a) !== Array.isArray(b)) return false;
  if (Array.isArray(a)) {
    if (a.length !== b.length) return false;
    return a.every((v, i) => deepEqual(v, b[i]));
  }
  const ak = Object.keys(a).sort();
  const bk = Object.keys(b).sort();
  if (ak.length !== bk.length || ak.some((k, i) => k !== bk[i])) return false;
  return ak.every((k) => deepEqual(a[k], b[k]));
}

/** Deep clone via JSON — sufficient here since state is plain JSON-shaped. */
function cloneJson(o) { return JSON.parse(JSON.stringify(o)); }

/** Build an isolated synthetic app state for tests that must not touch STATE. */
function synthTestState() {
  const s = defaultState();
  s.cycles.c1.startDate = '2026-09-14'; // a Monday
  return s;
}

/* -------------------------------------------------------- individual checks */

function testProgramIntegrity() {
  const mismatches = [];
  PROGRAM.weeks.forEach((wk, i) => {
    const actualSets = weekSetCount(wk);
    const expectedSets = EXPECTED_WEEK_SET_COUNTS[i];
    if (actualSets !== expectedSets) {
      mismatches.push(`wk${wk.week} sets: got ${actualSets}, expected ${expectedSets}`);
    }
    const expLabel = EXPECTED_WEEK_LABELS[i];
    if (wk.phase !== expLabel.phase || wk.variantLabel !== expLabel.variantLabel) {
      mismatches.push(`wk${wk.week} label: got phase ${wk.phase}/${wk.variantLabel}, expected phase ${expLabel.phase}/${expLabel.variantLabel}`);
    }
  });
  return {
    name: 'Program integrity vs §3 reference table',
    pass: mismatches.length === 0,
    detail: mismatches.length ? mismatches.join('; ') : `24/24 weeks match (${PROGRAM.weeks.reduce((n, w) => n + weekSetCount(w), 0)} total prescribed sets)`
  };
}

function testAddDaysDst() {
  const problems = [];
  // Spring-forward: US DST began 2026-03-08. A 7-day add must land exactly
  // one calendar week later, not shift by the lost hour.
  if (addDays('2026-03-01', 7) !== '2026-03-08') problems.push(`spring-forward: addDays(2026-03-01,7) = ${addDays('2026-03-01', 7)}`);
  if (addDays('2026-03-07', 1) !== '2026-03-08') problems.push(`spring-forward day: addDays(2026-03-07,1) = ${addDays('2026-03-07', 1)}`);
  // Fall-back: US DST ended 2026-11-01.
  if (addDays('2026-10-25', 7) !== '2026-11-01') problems.push(`fall-back: addDays(2026-10-25,7) = ${addDays('2026-10-25', 7)}`);
  if (addDays('2026-11-01', 1) !== '2026-11-02') problems.push(`fall-back day: addDays(2026-11-01,1) = ${addDays('2026-11-01', 1)}`);
  // Month/year rollover sanity, since real cycles run 24 weeks (168 days).
  if (addDays('2026-09-14', 168) !== '2027-03-01') problems.push(`24-week span: addDays(2026-09-14,168) = ${addDays('2026-09-14', 168)}`);
  return {
    name: 'addDays correctness across DST boundaries',
    pass: problems.length === 0,
    detail: problems.length ? problems.join('; ') : 'spring-forward, fall-back, and a full 168-day cycle span all land correctly'
  };
}

function testSnapToMonday() {
  const cases = [
    ['2026-09-14', '2026-09-14'], // already Monday
    ['2026-09-15', '2026-09-14'], // Tuesday
    ['2026-09-16', '2026-09-14'], // Wednesday
    ['2026-09-20', '2026-09-14'], // Sunday
    ['2026-09-21', '2026-09-21']  // next Monday
  ];
  const problems = cases
    .filter(([input, expected]) => snapToMonday(input) !== expected)
    .map(([input, expected]) => `snapToMonday(${input}) = ${snapToMonday(input)}, expected ${expected}`);
  return {
    name: 'Non-Monday start date snaps to the preceding Monday',
    pass: problems.length === 0,
    detail: problems.length ? problems.join('; ') : `${cases.length}/${cases.length} cases correct`
  };
}

function testStartDateChangePreservesLogs() {
  const s = synthTestState();
  const cid = 'c1';
  if (!s.logs[cid].weeks['3']) s.logs[cid].weeks['3'] = { days: {} };
  s.logs[cid].weeks['3'].days.mon = { items: { pushups: { sets: [true, true, false] } }, note: 'felt strong' };
  const before = cloneJson(s.logs[cid]);
  s.cycles[cid].startDate = '2026-10-05'; // reschedule — dates are derived (§4.5), logs untouched
  const after = s.logs[cid];
  const pass = deepEqual(before, after);
  return {
    name: 'Start-date change preserves every logged checkbox',
    pass,
    detail: pass ? 'logs tree byte-identical after rescheduling the cycle' : 'logs tree changed after editing startDate'
  };
}

function testNewCycleIsolation() {
  const s = synthTestState();
  const c1Before = cloneJson(s.logs.c1);
  s.logs.c1.weeks['1'] = { days: { mon: { items: { pushups: { sets: [true, false, false] } }, note: '' } } };
  const c1AfterFirstLog = cloneJson(s.logs.c1);
  // Start a fresh cycle c2 and write to it.
  s.cycles.c2 = { label: 'Cycle 2', startDate: '2027-01-04', status: 'active', createdAt: new Date().toISOString() };
  s.logs.c2 = { weeks: {} };
  s.logs.c2.weeks['1'] = { days: { mon: { items: { pushups: { sets: [true, true, true] } }, note: 'c2 data' } } };
  const c1Untouched = deepEqual(c1AfterFirstLog, s.logs.c1);
  return {
    name: 'New cycle isolation — writing to c2 leaves c1 byte-identical',
    pass: c1Untouched,
    detail: c1Untouched ? 'c1.logs unchanged after c2 was created and logged' : 'c1.logs was mutated by writing to c2'
  };
}

function testCsvEscaping() {
  const raw = 'a,b"c\nd';
  const escaped = csvEscapeField(raw);
  // RFC 4180: quoted, embedded quote doubled, comma/newline preserved inside.
  const expectedShape = escaped.startsWith('"') && escaped.endsWith('"') && escaped.includes('""');
  // Round-trip: a minimal RFC-4180 unescape of our own escaped output must
  // reproduce the original string exactly.
  const inner = escaped.slice(1, -1).replace(/""/g, '"');
  const roundTrips = inner === raw;
  const pass = expectedShape && roundTrips;
  return {
    name: 'CSV escaping — comma/quote/newline note round-trips',
    pass,
    detail: pass ? `"${raw.replace(/\n/g, '\\n')}" → ${escaped.replace(/\n/g, '\\n')} → back to original` : `escaping or round-trip failed on ${escaped}`
  };
}

function testCsvRowCountMatchesPrescribed() {
  const s = synthTestState();
  const savedState = STATE;
  STATE = s; // buildSetlogRows reads module-level STATE; swap in synthetic state for this check
  let rows, expectedRows;
  try {
    rows = buildSetlogRows(['c1']);
    let totalSets = 0, totalTasks = 0;
    PROGRAM.weeks.forEach((wk) => wk.days.forEach((d) => d.items.forEach((it) => {
      if (it.type === 'sets' || it.type === 'kb') totalSets += it.sets;
      else if (it.type === 'task') totalTasks += 1;
    })));
    expectedRows = totalSets + totalTasks;
  } finally {
    STATE = savedState;
  }
  const pass = rows.length === expectedRows;
  return {
    name: 'CSV row count equals total prescribed sets + tasks for the cycle',
    pass,
    detail: pass ? `${rows.length} setlog.csv rows for one full 24-week cycle` : `got ${rows.length} rows, expected ${expectedRows}`
  };
}

function testRowKeyUniqueness() {
  const s = synthTestState();
  s.cycles.c2 = { label: 'Cycle 2', startDate: '2027-01-04', status: 'active', createdAt: new Date().toISOString() };
  s.logs.c2 = { weeks: {} };
  const savedState = STATE;
  STATE = s;
  let rows;
  try {
    rows = buildSetlogRows(['c1', 'c2']);
  } finally {
    STATE = savedState;
  }
  const seen = new Set();
  let dupe = null;
  for (const r of rows) {
    if (seen.has(r.rowKey)) { dupe = r.rowKey; break; }
    seen.add(r.rowKey);
  }
  return {
    name: 'rowKey uniqueness across a full multi-cycle export',
    pass: !dupe,
    detail: dupe ? `duplicate rowKey: ${dupe}` : `${rows.length} rows, all rowKey values unique`
  };
}

function testBackupRestoreRoundTrip() {
  const s = synthTestState();
  s.logs.c1.weeks['5'] = { days: { fri: { items: { kb_goblet: { sets: [true, true, true, false], bellKg: 16, rpe: 7 } }, note: 'good session' } } };
  s.bodyweight['2026-10-01'] = 83.2;
  const backupJson = JSON.stringify(s);
  const parsed = JSON.parse(backupJson);
  const restored = Object.assign(defaultState(), parsed); // mirrors the app's restore-confirm path
  const pass = deepEqual(restored, parsed);
  return {
    name: 'Backup → restore round-trip is lossless',
    pass,
    detail: pass ? 'restore(backup(state)) deep-equals state' : 'restored state diverged from the backed-up state'
  };
}

function runSelfTests() {
  return [
    testProgramIntegrity(),
    testAddDaysDst(),
    testSnapToMonday(),
    testStartDateChangePreservesLogs(),
    testNewCycleIsolation(),
    testCsvEscaping(),
    testCsvRowCountMatchesPrescribed(),
    testBackupRestoreRoundTrip(),
    testRowKeyUniqueness()
  ];
}

      <div class="ref-table-wrap selftest-table">

function renderApp() {
  const parts = parseHash();
  const cid = currentCycleId();
  let html;

  if (parts.length === 0 || (parts.length === 1 && parts[0] === cid)) {
    html = renderOverview(cid);
  } else if (parts[0] === 'reference') {
    html = renderReference(cid);
  } else if (parts[0] === 'progress') {
    html = renderProgress(cid);
  } else if (parts[0] === 'export') {
    html = renderExport(cid);
  } else if (parts[0] === 'settings') {
    html = renderSettings(cid);
  } else if (parts[0] === 'selftest') {
    html = renderSelfTest(cid);
  } else if (parts[1] === 'month' && parts.length === 3) {
    html = renderMonth(cid, Number(parts[2]));
  } else if (parts[1] === 'month' && parts[3] === 'week' && parts.length === 5) {
    html = renderWeek(cid, Number(parts[4]));
  } else if (parts[1] === 'month' && parts[3] === 'week' && parts[5] === 'day' && parts.length === 7) {
    html = renderDay(cid, Number(parts[4]), parts[6]);
  } else {
    html = renderOverview(cid);
  }

  document.getElementById('app').innerHTML = html + storageWarningHtml() + toastHtml();
  window.scrollTo(0, 0);
}

function storageWarningHtml() {
  if (STORAGE_OK) return '';
  return `<div class="storage-warning" role="alert">Storage is unavailable in this browser (private mode?) — logging works but nothing will be saved after this tab closes.</div>`;
}

/* -------------------------------------------------------------- delegation */

document.addEventListener('DOMContentLoaded', () => {
  const app = document.getElementById('app');

  app.addEventListener('change', (e) => {
    const t = e.target;
    const parts = parseHash();
    const cid = currentCycleId();

    if (t.dataset && t.dataset.action === 'switch-cycle') {
      go(`#/${t.value}`);
      return;
    }

    if (parts[0] === 'settings') {
      const action = t.dataset && t.dataset.action;
      if (action === 'start-date-draft') {
        SETTINGS_UI.startDateDraft = t.value;
      } else if (action === 'new-cycle-start-draft') {
        SETTINGS_UI.newCycleStartDraft = t.value;
      }
      return;
    }

    if (parts[0] === 'export') {
      const action = t.dataset && t.dataset.action;
      if (action === 'export-scope') {
        EXPORT_UI.scope = t.value;
        renderApp();
      } else if (action === 'export-specific-cycle') {
        EXPORT_UI.specificCycleId = t.value;
        renderApp();
      } else if (action === 'export-preview-file') {
        EXPORT_UI.previewFile = t.value;
        renderApp();
      } else if (action === 'restore-file-pick') {
        const file = t.files && t.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const result = parseBackupFile(String(reader.result));
          RESTORE_PENDING = result.error ? { error: result.error } : { parsed: result.parsed };
          renderApp();
        };
        reader.onerror = () => {
          RESTORE_PENDING = { error: 'Could not read that file.' };
          renderApp();
        };
        reader.readAsText(file);
      }
      return;
    }

    if (parts[0] === 'progress') {
      const action = t.dataset && t.dataset.action;
      if (action === 'bw-date-draft') {
        PROGRESS_UI.bwDateDraft = t.value;
      } else if (action === 'bw-weight-draft') {
        PROGRESS_UI.bwWeightDraft = t.value;
      }
      return;
    }

    // Only the day screen has these controls; parts = [cid, 'month', m, 'week', w, 'day', dk]
    if (parts[5] !== 'day') return;
    const week = Number(parts[4]);
    const dayKey = parts[6];
    const action = t.dataset && t.dataset.action;

    if (t instanceof HTMLInputElement && t.type === 'checkbox' && action === 'toggle-set') {
      toggleSet(cid, week, dayKey, t.dataset.item, Number(t.dataset.idx), Number(t.dataset.total));
      renderApp();
      // Restore focus to the toggled control after re-render for keyboard users.
      const again = document.querySelector(
        `input[data-item="${cssEscape(t.dataset.item)}"][data-idx="${t.dataset.idx}"]`);
      if (again) again.focus();
      return;
    }

    if (t instanceof HTMLInputElement && t.type === 'checkbox' && action === 'toggle-task') {
      toggleTask(cid, week, dayKey, t.dataset.item);
      renderApp();
      const again = document.querySelector(`input[data-item="${cssEscape(t.dataset.item)}"][data-action="toggle-task"]`);
      if (again) again.focus();
      return;
    }

    // Bell / RPE / test / total-reps / note: save in place, no full re-render,
    // so focus and cursor position survive (§7.3 — sweaty-thumb, one-handed use).
    if (action === 'set-bell') {
      setBellKg(cid, week, dayKey, t.dataset.item, t.value);
    } else if (action === 'set-rpe') {
      setRpe(cid, week, dayKey, t.dataset.item, t.value);
    } else if (action === 'set-test') {
      setTestValue(cid, week, dayKey, t.dataset.item, t.dataset.field, t.value);
    } else if (action === 'set-total-reps') {
      setTotalReps(cid, week, dayKey, t.dataset.item, t.value);
    } else if (action === 'set-note') {
      setDayNote(cid, week, dayKey, t.value);
    }
  });

  app.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;

    if (action === 'dismiss-export-reminder') {
      EXPORT_REMINDER_DISMISSED = true;
      renderApp();
      return;
    }

    if (action === 'print-week') {
      window.print();
      return;
    }

    if (action === 'rerun-selftest') {
      renderApp();
      return;
    }

    const parts = parseHash();

    if (parts[0] === 'settings') {
      const targetCid = btn.dataset.cycle;
      if (action === 'edit-start-date') {
        SETTINGS_UI.editingStartDate = targetCid;
        SETTINGS_UI.startDateDraft = STATE.cycles[targetCid] ? STATE.cycles[targetCid].startDate : '';
        SETTINGS_UI.startDateSnapMsg = '';
        renderApp();
      } else if (action === 'cancel-edit-start-date') {
        SETTINGS_UI.editingStartDate = null;
        renderApp();
      } else if (action === 'save-start-date') {
        const targetId = SETTINGS_UI.editingStartDate;
        const raw = SETTINGS_UI.startDateDraft || (STATE.cycles[targetId] && STATE.cycles[targetId].startDate);
        editCycleStartDate(targetId, raw);
      } else if (action === 'begin-new-cycle') {
        SETTINGS_UI.newCycleConfirming = true;
        SETTINGS_UI.newCycleStartDraft = todayYMD();
        renderApp();
      } else if (action === 'cancel-new-cycle') {
        SETTINGS_UI.newCycleConfirming = false;
        renderApp();
      } else if (action === 'confirm-new-cycle') {
        confirmStartNewCycle(SETTINGS_UI.newCycleStartDraft);
      } else if (action === 'begin-delete-cycle') {
        beginDeleteCycle(targetCid);
      } else if (action === 'cancel-delete-cycle') {
        cancelDeleteCycle();
      } else if (action === 'export-for-delete') {
        exportCycleForDelete(SETTINGS_UI.deletePending ? SETTINGS_UI.deletePending.cycleId : targetCid);
      } else if (action === 'ack-have-export') {
        acknowledgeHaveExport();
      } else if (action === 'advance-delete-confirm') {
        advanceDeleteConfirm();
      }
      return;
    }

    if (parts[0] === 'progress') {
      if (action === 'log-bodyweight') {
        const date = PROGRESS_UI.bwDateDraft || todayYMD();
        setBodyweight(date, PROGRESS_UI.bwWeightDraft);
        PROGRESS_UI.bwWeightDraft = '';
        showToast(`Weight logged for ${date}`);
      }
      return;
    }

    if (parts[0] !== 'export') return;
    const scopeIds = resolveExportCycleIds();

    if (action === 'download-csv') {
      downloadCsvFile(btn.dataset.kind, scopeIds, EXPORT_UI.scope);
      showToast(`${btn.dataset.kind}.csv downloaded`);
    } else if (action === 'download-all-csv') {
      downloadAllCsv(scopeIds, EXPORT_UI.scope);
      showToast('All four CSVs downloaded');
    } else if (action === 'copy-csv') {
      copyCsvToClipboard(EXPORT_UI.previewFile, scopeIds);
    } else if (action === 'download-backup') {
      downloadBackup();
      showToast('Backup JSON downloaded');
    } else if (action === 'restore-confirm') {
      if (RESTORE_PENDING && RESTORE_PENDING.parsed) {
        STATE = Object.assign(defaultState(), RESTORE_PENDING.parsed);
        saveState();
        RESTORE_PENDING = null;
        go(`#/${STATE.activeCycleId}`);
        showToast('Backup restored.');
      }
    } else if (action === 'restore-cancel') {
      RESTORE_PENDING = null;
      renderApp();
    }
  });

  window.addEventListener('hashchange', renderApp);
  renderApp();

  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(() => {});
  }

  /* §6.1 — PWA install. The service worker caches only the three local
     files already shipped with this page; connect-src 'none' in the CSP
     blocks any network fetch, so registration is safe under the no-network
     guarantee. Missing sw.js/manifest (e.g. opened from file://) fails
     silently — HealthBot.html works standalone either way. */
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
});

function cssEscape(s) {
  return window.CSS && CSS.escape ? CSS.escape(s) : String(s).replace(/["\\]/g, '\\$&');
}
</script>
</body>
</html>
